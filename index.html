<!DOCTYPE html>
<html lang="zh-HK">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>生命分子快餐店</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100dvh;
      background-color: #f0f0f0;
      display: flex; justify-content: center; align-items: center;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      overscroll-behavior: none; overflow: hidden;
      touch-action: none; -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none;
    }

    #game-container {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
    }

    /* 🌟 針對遊戲畫布的終極禁令：不准反白、不准閃爍、不准啟動任何系統手勢 */
    canvas {
      touch-action: none !important;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }
  </style>
</head>

<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
  
  <script>
    // 🌟 核彈級防護：在最底層攔截所有觸控開始與移動，徹底封殺 iOS 系統手勢
    const killIOSGestures = (e) => {
      // 由於我們的輸入是透過原生 prompt() 彈出，所以可以安心地把網頁上的原生觸控全部殺掉
      e.preventDefault();
    };
    
    // 必須加上 passive: false 才能強制攔截
    document.addEventListener('touchstart', killIOSGestures, { passive: false });
    document.addEventListener('touchmove', killIOSGestures, { passive: false });
  </script>
</body>

</html>
