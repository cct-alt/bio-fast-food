<!DOCTYPE html>
<html lang="zh-HK">

<head>
  <meta charset="UTF-8" />
  <!-- 更新 viewport 設定：防止雙指縮放，並讓畫面貼齊螢幕邊緣 -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>生命分子快餐店</title>
  <style>
    /* 重置基礎樣式 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      /* 將 100vh 改為 100dvh，這是解決 Safari 工具列遮擋的關鍵 */
      height: 100dvh;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;

      /* 關鍵：防止 iPad 拖曳分子時網頁跟著滑動、下拉更新或反白文字 */
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
